<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polar Slicer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Polar&nbsp;Slicer</h1>
    <span class="subtitle">STL &rarr; polar (R, &theta;, Z) G-code</span>
  </header>

  <main>
    <!-- ------- Controls ------- -->
    <section class="panel controls">
      <h2>1. Load &amp; configure</h2>

      <label class="file">
        <span id="file-label">Choose an STL file&hellip;</span>
        <input type="file" id="stl" accept=".stl" />
      </label>

      <div class="grid">
        <label>Layer height (mm)
          <input type="number" id="layer_height" value="0.2" step="0.05" min="0.05" />
        </label>
        <label>Extrusion width (mm)
          <input type="number" id="extrusion_width" value="0.4" step="0.05" min="0.05" />
        </label>
        <label>Perimeters
          <input type="number" id="perimeters" value="2" step="1" min="0" />
        </label>
        <label>Wall thickness (mm)
          <input type="number" id="wall_thickness" value="1.2" step="0.1" min="0" />
        </label>
        <label>Infill (%)
          <input type="number" id="infill_percentage" value="20" step="5" min="0" max="100" />
        </label>
        <label>Infill type
          <select id="infill_type">
            <option value="grid">Grid</option>
            <option value="solid">Solid</option>
          </select>
        </label>
        <label>Angular steps
          <input type="number" id="angular_steps" value="180" step="10" min="3" />
        </label>
      </div>

      <button id="slice-btn" disabled>Slice</button>
      <button id="download-btn" disabled>Download G-code</button>

      <p id="status" class="status"></p>
      <div id="stats" class="stats"></div>
    </section>

    <!-- ------- Viewer ------- -->
    <section class="panel viewer">
      <h2>2. Preview by layer</h2>
      <div class="canvas-wrap">
        <canvas id="canvas" width="640" height="640"></canvas>
      </div>

      <div class="layer-controls">
        <button id="prev" disabled>&#9664;</button>
        <button id="play" disabled>Play</button>
        <button id="next" disabled>&#9654;</button>
        <input type="range" id="layer-slider" min="0" max="0" value="0" disabled />
        <span id="layer-label" class="layer-label">&mdash;</span>
      </div>

      <label class="ghost-toggle">
        <input type="checkbox" id="ghost" /> Show lower layers (ghost)
      </label>

      <ul class="legend">
        <li><span class="swatch perimeter"></span> Perimeter</li>
        <li><span class="swatch infill"></span> Infill</li>
        <li><span class="swatch travel"></span> Travel</li>
      </ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
